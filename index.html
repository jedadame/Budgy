<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e9f8e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f5;--card:#fff;--ink:#14213d;--mute:#6b7787;--line:#dde3ea;--acc:#0e9f8e;--accink:#fff;--bad:#d64545}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1622;--card:#182233;--ink:#e8eef6;--mute:#92a0b3;--line:#263349;--acc:#2dd4bf;--accink:#06231f;--bad:#f28b8b}}
:root[data-theme="dark"]{--bg:#0f1622;--card:#182233;--ink:#e8eef6;--mute:#92a0b3;--line:#263349;--acc:#2dd4bf;--accink:#06231f;--bad:#f28b8b}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:22px;margin:4px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.amt{display:flex;align-items:center;gap:6px;font-size:44px;font-weight:700}
.amt input{font:inherit;width:100%;border:0;background:none;color:var(--ink);outline:none;min-width:0}
input.txt,select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:9px 13px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.btn{width:100%;margin-top:12px;padding:14px;font:inherit;font-weight:700;font-size:17px;border:0;border-radius:12px;background:var(--acc);color:var(--accink);cursor:pointer}
.btn:disabled{opacity:.4}
.msg{min-height:22px;margin-top:10px;color:var(--acc);font-weight:600;text-align:center}
.row{display:flex;gap:8px;margin-bottom:10px}
.row>*{flex:1}
.total{font-size:30px;font-weight:700;margin:2px 0 0}
.mute{color:var(--mute);font-size:14px}
.entry{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.entry .m{flex:1;min-width:0}
.entry .m b{display:block}
.entry .m span{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.x{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.grid .card{margin:0;padding:12px}
.bar{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:14px}
.bar .l{width:92px;flex:none}
.bar .t{flex:1;height:14px;background:var(--bg);border-radius:7px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:7px}
.bar .v{width:64px;text-align:right;flex:none}
.days{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:8px}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mute)}
.days i{display:block;width:100%;background:var(--acc);border-radius:6px 6px 0 0;min-height:2px}
.empty{color:var(--mute);text-align:center;padding:18px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 4px;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;cursor:pointer}
nav button[aria-selected="true"]{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
 <section id="t0">
  <h1>Add expense</h1>
  <div class="card">
   <label class="amt"><span>$</span><input id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" aria-label="Amount"></label>
  </div>
  <div class="card">
   <div class="mute">Category</div>
   <div class="chips" id="chips"></div>
   <input class="txt" id="note" type="text" placeholder="Note (optional)" maxlength="60">
   <button class="btn" id="add" disabled>Add expense</button>
   <div class="msg" id="msg" aria-live="polite"></div>
  </div>
 </section>

 <section id="t1" hidden>
  <h1>Entries</h1>
  <div class="row">
   <select id="per" aria-label="Time period">
    <option value="today">Today</option><option value="week">This week</option>
    <option value="month" selected>This month</option><option value="year">This year</option><option value="all">All time</option>
   </select>
   <select id="cat" aria-label="Category"></select>
  </div>
  <div class="card"><div class="mute" id="lbl">Spent</div><div class="total" id="tot">$0.00</div></div>
  <div class="card" id="list"></div>
 </section>

 <section id="t2" hidden>
  <h1>Stats</h1>
  <div class="grid" id="kpis"></div>
  <div class="card"><b>Last 7 days</b><div class="days" id="days"></div></div>
  <div class="card">
   <div class="row" style="align-items:center;margin-bottom:4px"><b>By category</b>
    <select id="per2" aria-label="Period for categories"><option value="week">This week</option><option value="month" selected>This month</option><option value="year">This year</option><option value="all">All time</option></select></div>
   <div id="bars"></div>
  </div>
 </section>
</main>

<nav role="tablist">
 <button role="tab" aria-selected="true" data-t="0">Add</button>
 <button role="tab" aria-selected="false" data-t="1">Entries</button>
 <button role="tab" aria-selected="false" data-t="2">Stats</button>
</nav>

<script>
const CATS={Food:'#e8833a',Entertainment:'#8b5cf6',Transport:'#3b82f6',Shopping:'#ec4899',Bills:'#64748b',Health:'#22c55e',Other:'#a3a3a3'};
const $=id=>document.getElementById(id);
let data=[],sel=null;
try{data=JSON.parse(localStorage.getItem('exp')||'[]')}catch(e){data=[]}
const save=()=>{try{localStorage.setItem('exp',JSON.stringify(data))}catch(e){}};
const money=n=>'$'+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const sod=d=>{d=new Date(d);d.setHours(0,0,0,0);return d};
function start(p){const n=sod(new Date());
 if(p==='today')return n;
 if(p==='week'){n.setDate(n.getDate()-((n.getDay()+6)%7));return n}
 if(p==='month'){n.setDate(1);return n}
 if(p==='year'){n.setMonth(0,1);return n}
 return new Date(0)}
const inRange=(p)=>data.filter(e=>e.t>=start(p).getTime());
const sum=a=>a.reduce((s,e)=>s+e.a,0);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// tabs
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
 [0,1,2].forEach(i=>$('t'+i).hidden=i!=b.dataset.t);
 render();window.scrollTo(0,0)});

// add tab
$('chips').innerHTML=Object.keys(CATS).map(c=>`<button class="chip" aria-pressed="false" data-c="${c}">${c}</button>`).join('');
$('chips').onclick=e=>{const c=e.target.dataset.c;if(!c)return;sel=c;
 document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===c));check()};
const check=()=>$('add').disabled=!(parseFloat($('amt').value)>0&&sel);
$('amt').oninput=check;
$('add').onclick=()=>{const a=parseFloat($('amt').value);if(!(a>0)||!sel)return;
 data.push({id:Date.now(),a:Math.round(a*100)/100,c:sel,n:$('note').value.trim(),t:Date.now()});save();
 $('msg').textContent='Added '+money(a)+' to '+sel;
 $('amt').value='';$('note').value='';sel=null;
 document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',false));check();
 setTimeout(()=>$('msg').textContent='',2500)};

// entries tab
$('cat').innerHTML='<option value="">All categories</option>'+Object.keys(CATS).map(c=>`<option>${c}</option>`).join('');
$('per').onchange=$('cat').onchange=renderEntries;
$('list').onclick=e=>{const id=e.target.dataset.del;if(!id)return;
 data=data.filter(x=>x.id!=id);save();renderEntries()};
function renderEntries(){
 let a=inRange($('per').value);const c=$('cat').value;if(c)a=a.filter(e=>e.c===c);
 a.sort((x,y)=>y.t-x.t);
 $('lbl').textContent='Spent · '+$('per').selectedOptions[0].text.toLowerCase()+(c?' · '+c:'');
 $('tot').textContent=money(sum(a));
 $('list').innerHTML=a.length?a.map(e=>`<div class="entry"><i class="dot" style="background:${CATS[e.c]}"></i>
  <div class="m"><b>${e.c}</b><span>${new Date(e.t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}${e.n?' · '+esc(e.n):''}</span></div>
  <b>${money(e.a)}</b><button class="x" data-del="${e.id}" aria-label="Delete entry">×</button></div>`).join('')
  :'<div class="empty">No expenses here yet.</div>'}

// stats tab
$('per2').onchange=renderStats;
function renderStats(){
 const d=sum(inRange('today')),w=sum(inRange('week')),m=sum(inRange('month'));
 const days=Math.max(1,new Date().getDate());
 $('kpis').innerHTML=[['Today',d],['This week',w],['This month',m],['Daily average (month)',m/days]]
  .map(([l,v])=>`<div class="card"><div class="mute">${l}</div><b style="font-size:20px">${money(v)}</b></div>`).join('');
 const last=[...Array(7)].map((_,i)=>{const x=sod(new Date());x.setDate(x.getDate()-6+i);
  const s=x.getTime(),e=s+864e5;return{l:x.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2),v:sum(data.filter(z=>z.t>=s&&z.t<e))}});
 const mx=Math.max(1,...last.map(x=>x.v));
 $('days').innerHTML=last.map(x=>`<div title="${money(x.v)}">${x.v?Math.round(x.v):''}<i style="height:${x.v/mx*80}%"></i>${x.l}</div>`).join('');
 const a=inRange($('per2').value),tot=sum(a);
 const by=Object.keys(CATS).map(c=>({c,v:sum(a.filter(e=>e.c===c))})).filter(x=>x.v).sort((x,y)=>y.v-x.v);
 $('bars').innerHTML=by.length?by.map(x=>`<div class="bar"><span class="l">${x.c}</span><span class="t"><i style="width:${x.v/by[0].v*100}%;background:${CATS[x.c]}"></i></span><span class="v">${Math.round(x.v/tot*100)}%<br><small class="mute">${money(x.v)}</small></span></div>`).join('')
  :'<div class="empty">Add some expenses to see the breakdown.</div>'}

function render(){renderEntries();renderStats()}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
